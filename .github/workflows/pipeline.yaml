name: pipeline
on: [push, pull_request]

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
    - name: Install python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install poetry
      run: pipx install poetry

    - name: Install dependencies
      run: poetry install

    - name: Run tests!
      run: poetry run task test
