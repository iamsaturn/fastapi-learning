name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:  
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy
        run: flyctl deploy
        working-directory: mynewapi