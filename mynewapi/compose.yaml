services:
  mynewapi_database:
    image: postgres:17
    volumes:
    - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
  mynewapi_app:
    image: mynewapi_app
    build: .
    entrypoint: ./entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      - mynewapi_database
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@mynewapi_database:5432/app_db
volumes:
  pgdata: